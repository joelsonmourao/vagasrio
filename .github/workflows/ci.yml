name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: astro-portal
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/vagasrio_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: astro-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test editorial indexing rules
        run: npm run test:blog-indexing

      - name: Test public brand and zero-jobs copy
        run: npm run test:public-copy

      - name: Build production portal
        run: npm run build:postgres

  php-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: php:8.2-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint production PHP
        shell: bash
        run: |
          find app config public templates scripts -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Verify destructive reset guard without executing it
        shell: bash
        run: |
          php -r '
            $source = file_get_contents("scripts/reset-demo-rj.php");
            $bootstrap = strpos($source, "app/bootstrap.php");
            $guards = [
              strpos($source, "PHP_SAPI"),
              strpos($source, "APP_ENV"),
              strpos($source, "RESET_DEMO_CONFIRMATION"),
              strpos($source, "development"),
              strpos($source, "test"),
            ];
            if ($bootstrap === false) {
              fwrite(STDERR, "bootstrap marker missing\n");
              exit(1);
            }
            foreach ($guards as $guard) {
              if ($guard === false || $guard > $bootstrap) {
                fwrite(STDERR, "reset guard missing or placed after bootstrap\n");
                exit(1);
              }
            }
            echo "reset guard is present before bootstrap\n";
          '
