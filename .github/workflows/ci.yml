name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: astro-portal
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/vagasrio_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: astro-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test editorial indexing rules
        run: npm run test:blog-indexing

      - name: Build production portal
        run: npm run build:postgres
